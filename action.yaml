name: "PR Summary Action"

description: "Generates PR summaries, labels, and comments for pull requests"

author: "Damiano Testa"

inputs:
  GITHUB_TOKEN:
    description: 'Token used to access the GitHub API to post comments and manage labels. If unset, it uses a default value. You could alternatively set to secrets.GITHUB_TOKEN or another token of your choice.'
    required: false
    default: ${{ github.token }}
  MAIN_BRANCH:
    description: 'The name of the main branch against which to compare the changes. The default is the base branch of the PR'
    required: false
    default: ${{ github.base_ref }}
  ROOT_DIR:
    description: 'The name of the main directory used for import changes. The default is the name of the repository, with the first letter capitalized.'
    required: false
    default: ''
  IMPORT_DIFF:
    description: 'Set to false if the summary should not include import changes. The default value is true.'
    required: false
    default: true
  DECLARATION_SUMMARY:
    description: 'Set to false if the summary should not include the declarations diff. The default value is true.'
    required: false
    default: true
  TECH_DEBT_SUMMARY:
    description: 'Set to false if the summary should not include the technical debt diff. The default value is true.'
    required: false
    default: true
  REMOVED_FILE_SUMMARY:
    description: 'Set to false if the summary should not include removed files reports. The default value is true.'
    required: false
    default: true

runs:
  using: "composite"
  steps:

    #- name: Dump GitHub context
    #  env:
    #    GITHUB_CONTEXT: ${{ toJson(github) }}
    #  shell: bash
    #  run: echo "$GITHUB_CONTEXT"

    - name: Set the root dir for import diffs
      id: globals
      shell: bash
      run: |
        # Set the root dir for import diffs
        if [ -n "${{ inputs.ROOT_DIR }}" ]
        then
          rootDir="${{ inputs.ROOT_DIR }}"
        else
          # Strip out the name of owner of the repo to expose the just the name of the repo
          rootDir="${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}"
          # Capitalize the first letter of the name of the repo
          rootDir="${rootDir^}"
        fi
        printf $'Import diffs take into account the following directory:\n'
        echo "rootDir=${rootDir}" | tee -a "${GITHUB_OUTPUT}"

    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Update the merge-conflict label
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      shell: bash
      run: |
        # Update the merge-conflict label
        printf 'PR number: "%s"\n' "${{ github.event.pull_request.number }}"
        git config user.name "PR-summary-bot"
        git config user.email "PR-summary-bot@users.noreply.github.com"

        printf $'Main branch: \'%s\'.\nPR branch:   \'%s\'\n' "${{ inputs.MAIN_BRANCH }}" "${{ github.head_ref }}"
        git checkout "${{ github.head_ref }}"
        if git merge "origin/${{ inputs.MAIN_BRANCH }}" --no-ff --no-commit
        then
          git merge --abort || true
          printf $'This PR does not have merge conflicts with %s.\nRemoving \'merge-conflict\' label, if present.' "${{ inputs.MAIN_BRANCH }}"
          gh pr edit "${PR}" --remove-label merge-conflict
        else
          printf $'This PR has merge conflicts with %s.\nAdding the \'merge-conflict\' label.' "${{ inputs.MAIN_BRANCH }}"
          gh pr edit "${PR}" --add-label merge-conflict
        fi

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: 3.12

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        sudo apt-get install -y jq
        # If you have additional dependencies, install them here

    - name: Get changed and removed/renamed files
      shell: bash
      run: |
        # Get changed and removed/renamed files
        git fetch origin ${{ inputs.MAIN_BRANCH }}  # fetch the base branch

        tallyFile () {
          local number="$(wc -l < "${1}")"
          local type="${1//_/ }"
          if [ "${number}" == "1" ]; then type="${type%s.txt}"; else type="${type%.txt}"; fi
          printf $'%s %s.\n' "${number}" "${type}"
        }
        # Get the list of all changed files.
        echo "Saving the changed files to 'changed_files.txt'..."
        git diff --name-only origin/${{ inputs.MAIN_BRANCH }}... > changed_files.txt
        tallyFile changed_files.txt
        # Get all files which were removed or renamed.
        echo "Checking for removed files..."

        # Shows the `D`eleted files, one per line.
        git diff --name-only --diff-filter D origin/${{ inputs.MAIN_BRANCH }}... > removed_files.txt
        tallyFile removed_files.txt
        echo "Checking for renamed files..."

        # Shows the `R`enamed files, in human readable format
        # The `awk` pipe
        # * extracts into an array the old name as the key and the new name as the value
        # * eventually prints "`oldName` was renamed to `newName`" for each key-value pair.
        git diff -p --summary --diff-filter=R origin/${{ inputs.MAIN_BRANCH }}... |
          awk '
            /^rename from / {
                file=$0
                gsub(/rename from /, "", file)
                oldFile=file
              }
            /^rename to / {
                file=$0
                gsub(/rename to /, "", file)
                oldNew[oldFile]=file
              } END {
                for(old in oldNew) {
                  printf("`%s` was renamed to `%s`\n", old, oldNew[old])
                }
              }' > renamed_files.txt
        tallyFile renamed_files.txt

    - name: Compute (re)moved files without deprecation
      shell: bash
      run: |
        # Compute (re)moved files without deprecation
        touch moved_without_deprecation.txt
        touch extraneous_deprecated_module.txt
        git checkout ${{ github.base_ref }}
        while IFS= read -r file
        do
          if grep ^deprecated_module "${file}" ; then
            # shellcheck disable=SC2016
            printf '\n⚠️ **warning**: removed file `%s` contains a module deprecation: please add this in a follow-up PR instead\n' "${file}" |
              tee -a extraneous_deprecated_module.txt
          else
            # shellcheck disable=SC2016
            printf '\nnote: file `%s` was removed.\nPlease create a follow-up pull request adding a module deprecation. Thanks!\n' "${file}" |
              tee -a moved_without_deprecation.txt
          fi
        done < removed_files.txt
        IFS=$'\n'
        while IFS= read -r file
        do
          if grep ^deprecated_module "${file}" ; then
            # shellcheck disable=SC2016
            printf '\n⚠️ **warning**: renamed file `%s` contains a module deprecation: please add this in a follow-up PR instead\n' "${file}" |
              tee -a extraneous_deprecated_module.txt
          else
            # shellcheck disable=SC2016
            printf '\nnote: file %s without a module deprecation\nPlease create a follow-up pull request adding one. Thanks!\n' "${file}" |
              tee -a moved_without_deprecation.txt
          fi
        done < renamed_files.txt

    - name: Set GitHub Path
      run: |
        printf $'Looking for the \'count-trans-deps.py\' script file, in case there are issues with the path:\n'
        find /home/runner/ -name 'count-trans-deps.py'
        path=home/runner/work/_actions/adomani/PR_summary/dev/scripts
        printf $'correct path: %s\nfound path:  %s\n' "${path}" "${GITHUB_ACTION_PATH}"
        echo "$GITHUB_ACTION_PATH" | tee -a "${GITHUB_PATH}"
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}

    - name: Compute transitive imports
      shell: bash
      run: |
        # Compute transitive imports

        printf $'Checkout the merge base\n'
        git checkout "$(git merge-base "${{ inputs.MAIN_BRANCH }}" ${{ github.event.pull_request.head.sha }})"

        echo "Compute the counts for the merge base"
        python "${GITHUB_ACTION_PATH}/scripts/count-trans-deps.py" "${{ steps.globals.outputs.rootDir }}/" | tee base.json

        printf $'Checkout the \'%s\' branch\n' "${{ github.head_ref }}"
        git checkout "${{ github.head_ref }}"

        echo "Compute the counts for the HEAD of the PR"
        python "${GITHUB_ACTION_PATH}/scripts/count-trans-deps.py" "${{ steps.globals.outputs.rootDir }}/" | tee head.json

    - name: Import report
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }} # used by gh to edit labels
      id: import_diff
      shell: bash
      run: |
        # Import report

        SEPARATOR="###0###"
        printf $'separator=%s\n' "${SEPARATOR}" | tee -a "${GITHUB_OUTPUT}"

        graphAndHighPercentReports=$(python "${GITHUB_ACTION_PATH}/scripts/import-graph-report.py" base.json head.json changed_files.txt "${SEPARATOR}")

        echo "Produce import count comment"
        importCount=$(
          printf '%s\n' "${graphAndHighPercentReports}" | sed '/^Import changes exceeding/Q'
          "${GITHUB_ACTION_PATH}/scripts/import_trans_difference.sh" "${{ inputs.MAIN_BRANCH }}" "${{ steps.globals.outputs.rootDir }}" "${SEPARATOR}"
        )

        echo "Produce high percentage imports"
        high_percentages=$(
          printf '%s\n' "${graphAndHighPercentReports}" | sed -n '/^Import changes exceeding/,$p'
        )
        # if there are files with large increase in transitive imports, then we add the `large-import` label
        echo "High percentage imports produced"
        if [ -n "${high_percentages}" ]
        then
          echo "Large import found, adding \'large-import\' label."
          high_percentages=$'\n\n'"${high_percentages}"
          gh pr edit "${PR}" --add-label large-import
        else # otherwise, we remove the label
          printf $'No large import found for PR %s, removing \'large-import\' label.\n' "${PR}"
          gh pr edit "${PR}" --remove-label large-import
        fi

        if [ "$(printf '%s' "${importCount}" | wc -l)" -gt 12 ]
        then
          importCount="$(printf '<details><summary>\n\n%s\n\n</summary>\n\n%s\n\n</details>\n' "#### Import changes for modified files" "${importCount}")"
        else
          importCount="$(printf '#### Import changes for modified files\n\n%s\n' "${importCount}")"
        fi

        printf $'Add import report to the summary file\n'
        printf 'report<<IMP_DIFF_REP\n%s\n\n%s\nIMP_DIFF_REP\n' "${high_percentages}" "${importCount}" | tee -a "${GITHUB_OUTPUT}"

    - name: Post or update the summary comment
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }} # used by gh to edit labels
      shell: bash
      run: |
        # Post or update the summary comment

        summaryFile=please_merge_the_main_branch.md
        appendSummary () {
          printf $'%s\n---\n' "${1}" >> "${summaryFile}"
        }
        git checkout "${{ github.head_ref }}"

        hashURL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ github.event.pull_request.head.sha }}"
        printf 'hashURL: %s\n' "${hashURL}"

        shortHash="$(git rev-parse --short HEAD)"
        PR="${{ github.event.pull_request.number }}"
        title="### PR summary"
        #appendSummary "${title}"

        printf $'Create the summary header\n'
        printf '%s [%s](%s)' "${title}" "${shortHash}" "${hashURL}" >> "${summaryFile}"

        printf $'Add import report to the summary file\n'
        printf '%s\n' "${{ steps.import_diff.outputs.report }}" | sed 's='"${{ steps.import_diff.outputs.separator }}"'=`=g' >> "${summaryFile}"

        echo "Compute Declarations' diff comment"
        declDiff=$("${GITHUB_ACTION_PATH}/scripts/declarations_diff.sh")
        if [ "$(printf '%s' "${declDiff}" | wc -l)" -gt 15 ]
        then
          declDiff="$(printf '<details><summary>\n\n%s\n\n</summary>\n\n%s\n\n</details>\n' "#### Declarations diff" "${declDiff}")"
        else
          declDiff="$(printf '#### Declarations diff\n\n%s\n' "${declDiff}")"
        fi
        git checkout "${{ github.head_ref }}" --

        printf $'Add the declarations diff to the summary file\n'
        printf '\n\n---\n\n%s' "${declDiff}" >> "${summaryFile}"

        echo "Compute technical debt changes"
        techDebtVar="$("${GITHUB_ACTION_PATH}/scripts/technical-debt-metrics.sh" pr_summary)"

        printf $'Add the technical debts to the summary file\n'
        printf '\n\n---\n\n%s' "${techDebtVar}" >> "${summaryFile}"

        # store in a file, to avoid "long arguments" error.
        #printf '%s [%s](%s)%s\n\n%s\n\n---\n\n%s\n\n---\n\n%s\n' "${title}" "${shortHash}" "${hashURL}" "${high_percentages}" "${importCount}" "${declDiff}" "${techDebtVar}" > please_merge_the_main_branch.md

        echo "Include any errors about removed or renamed files without deprecation,"
        echo "as well as errors about extraneous deprecated_module additions."
        if [ -s moved_without_deprecation.txt ]
        then
          printf '\n\n---\n\n' >> "${summaryFile}"
          cat moved_without_deprecation.txt >> "${summaryFile}"
        fi
        if [ -s extraneous_deprecated_module.txt ]
        then
          printf '\n\n---\n\n' >> "${summaryFile}"
          cat extraneous_deprecated_module.txt >> "${summaryFile}"
        fi
        echo "" >> "${summaryFile}"

        cat "${summaryFile}"
        "${GITHUB_ACTION_PATH}/scripts/update_PR_comment.sh" "${summaryFile}" "${title}" "${PR}"

    - name: Update the file-removed label
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        # Update the file-removed label

        git checkout "${{ github.head_ref }}"
        undeprecatedMoves="$(cat moved_without_deprecation.txt)"
        if [ -n "$undeprecatedMoves" ]; then
          printf $'This PR has undeprecated module (re)movals.\nAdding the \'file-removed\' label.\n'
          gh pr edit "${PR}" --add-label file-removed
        else
          printf $'This PR (re)moves no modules without deprecations.\nRemoving the \'file-removed\' label.\n'
          gh pr edit "${PR}" --remove-label file-removed
        fi
